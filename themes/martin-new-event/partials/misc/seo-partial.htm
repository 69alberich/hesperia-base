{% if seo_props  %}
    <title>{{seo_props.titulo}}</title>

    <meta name="description" content="{{html_strip(seo_props.descripcion)}}">
    <link rel="canonical" href="{{seo_props.url}}" />
    <meta name="robots" content="{{seo_props.robots}}">

    <meta property="og:url" content="{{seo_props.url}}" />
    <meta property="og:type" content="{{seo_props.type}}" />
    <meta property="og:title" content="{{seo_props.titulo}}" />
    <meta property="og:description" content="{{html_strip(seo_props.descripcion)}}" />
    <meta property="og:image" content="{{seo_props.imagen}}" />

{% endif %}
