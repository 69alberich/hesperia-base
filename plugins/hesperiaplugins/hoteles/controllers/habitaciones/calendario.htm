$jsAvailUrl  = Backend::url('hesperiaplugins/hoteles/habitaciones/calendario_events/'  . $roomId);
$jsPricesUrl = Backend::url('hesperiaplugins/hoteles/habitaciones/calendario_prices/' . $roomId);

<script>
    document.addEventListener('DOMContentLoaded', function () {

        var calendarEl = document.getElementById('room-calendar');
        var availUrl   = <?= json_encode($jsAvailUrl) ?>;
        var pricesUrl  = <?= json_encode($jsPricesUrl) ?>;
        var noAlert = document.getElementById('no-prices-alert');
        var noAlertLabel = document.getElementById('no-prices-currency');
        var currencySelect = document.getElementById('currency-select');

        // State
        var allPriceEvents    = [];   // Full response from server (all occupancies)
        var currentViewInfo   = null; // Last datesSet info — needed for currency-change re-fetch
        var priceEventSource  = null; // FullCalendar event source handle for price events

        // Cache checkbox references once — avoids repeated querySelectorAll on every toggle
        var occupancyChecks = Array.from(document.querySelectorAll('.occupancy-check'));

        // ---------------------------------------------------------------
        // Helpers
        // ---------------------------------------------------------------

        function checkedOccupancies() {
            // Use a Set for O(1) lookup when filtering
            return new Set(
                occupancyChecks
                    .filter(function (el) { return el.checked; })
                    .map(function (el) { return el.value; })
            );
        }

        function selectedCurrencyAcronym() {
            if (!currencySelect) return '';
            var opt = currencySelect.options[currencySelect.selectedIndex];
            return opt ? (opt.getAttribute('data-acronym') || '') : '';
        }

        // Replace the price event source in two re-renders (remove + add).
        // Each day event contains ALL occupancy prices; we filter the prices array
        // per event here so eventContent always receives only the active occupancies.
        function applyPriceEvents() {
            // 1 re-render: drop the entire previous source at once
            if (priceEventSource) {
                priceEventSource.remove();
                priceEventSource = null;
            }

            // Show/hide the no-prices notice
            if (allPriceEvents.length === 0) {
                noAlertLabel.textContent = selectedCurrencyAcronym();
                noAlert.style.display = '';
                return;
            }
            noAlert.style.display = 'none';

            var active = checkedOccupancies();

            // For each day event, keep only the prices whose occupancy is checked.
            // Days where no occupancy survives the filter are dropped entirely.
            var filtered = allPriceEvents
                .map(function (dayEvent) {
                    var visiblePrices = dayEvent.extendedProps.prices.filter(function (p) {
                        return active.has(p.occupancy);
                    });
                    if (visiblePrices.length === 0) return null;

                    return {
                        start:           dayEvent.start,
                        allDay:          true,
                        backgroundColor: 'transparent',
                        borderColor:     'transparent',
                        extendedProps: {
                            availability: dayEvent.extendedProps.availability,
                            prices:       visiblePrices,
                        },
                    };
                })
                .filter(Boolean);

            // 1 re-render: add all filtered day events as a single source
            if (filtered.length > 0) {
                priceEventSource = calendar.addEventSource(filtered);
            }
        }

        // Fetch prices from the server for the current view and selected currency
        function fetchPrices(viewInfo) {
            if (!currencySelect) return;
            var currencyId = currencySelect.value;

            fetch(
                pricesUrl
                + '?currency_id=' + encodeURIComponent(currencyId)
                + '&start=' + encodeURIComponent(viewInfo.startStr)
                + '&end=' + encodeURIComponent(viewInfo.endStr),
                { headers: { 'X-Requested-With': 'XMLHttpRequest' } }
            )
                .then(function (r) { return r.json(); })
                .then(function (events) {
                    allPriceEvents = events;
                    applyPriceEvents();
                })
                .catch(function () {
                    allPriceEvents = [];
                    applyPriceEvents();
                });
        }

        // ---------------------------------------------------------------
        // FullCalendar init
        // ---------------------------------------------------------------

        var calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            locale: 'es',
            height: 'auto',
            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: ''
            },

            // Availability colors — URL-based event source (FullCalendar manages re-fetch on navigation)
            events: function (info, successCallback, failureCallback) {
                fetch(
                    availUrl
                    + '?start=' + encodeURIComponent(info.startStr)
                    + '&end=' + encodeURIComponent(info.endStr),
                    { headers: { 'X-Requested-With': 'XMLHttpRequest' } }
                )
                    .then(function (r) { return r.json(); })
                    .then(successCallback)
                    .catch(failureCallback);
            },

            // Custom card rendered inside each day cell for price events.
            // Background events (availability colors) are skipped — FullCalendar
            // handles those internally and never calls eventContent for them.
            eventContent: function (info) {
                var props = info.event.extendedProps;

                // Guard: only render cards for our price events
                if (!props || !Array.isArray(props.prices)) return;

                var priceRows = props.prices.map(function (p) {
                    return '<div class="fc-day-price-row">'
                        + '<span class="fc-day-occ">' + p.label + '</span>'
                        + '<span class="fc-day-amt">' + p.currency + '&nbsp;' + p.price.toFixed(2) + '</span>'
                        + '</div>';
                }).join('');

                return {
                    html: '<div class="fc-day-card">'
                        + '<div class="fc-day-avail">'
                        +   '<span class="fc-day-avail-num">' + props.availability + '</span>'
                        +   '<span class="fc-day-avail-label">&nbsp;disp.</span>'
                        + '</div>'
                        + '<div class="fc-day-prices">' + priceRows + '</div>'
                        + '</div>',
                };
            },

            // Fires on initial load and every time the user navigates — triggers price fetch
            datesSet: function (info) {
                currentViewInfo = info;
                fetchPrices(info);
            },
        });

        calendar.render();

        // ---------------------------------------------------------------
        // Control event listeners
        // ---------------------------------------------------------------

        // Currency change → re-fetch prices from server
        if (currencySelect) {
            currencySelect.addEventListener('change', function () {
                if (currentViewInfo) fetchPrices(currentViewInfo);
            });
        }

        // Occupancy toggle → filter in memory, no server round-trip
        document.querySelectorAll('.occupancy-check').forEach(function (cb) {
            cb.addEventListener('change', applyPriceEvents);
        });

    });
</script>
