tabs:
    fields:
        titulo:
            label: Titulo
            span: auto
            type: text
            tab: General
        slug:
            label: Slug
            span: auto
            preset:
                field: titulo
                type: slug
            type: text
            comment: 'Si es unitario'
            tab: General
        hotel:
            label: Hotel
            nameFrom: nombre
            descriptionFrom: description
            span: auto
            required: 1
            type: relation
            tab: General
        destacado:
            label: Destacado
            span: auto
            type: switch
            tab: General
        cantidad_min:
            label: 'Cantidad Minima'
            span: auto
            type: number
            tab: General
        cantidad_max:
            label: 'Cantidad Maxima'
            span: auto
            type: number
            tab: General
        imagen:
            label: imagen
            oc.commentPosition: ''
            mode: image
            imageWidth: '200'
            imageHeight: '100'
            useCaption: true
            thumbOptions:
                mode: crop
                extension: auto
            span: auto
            required: 1
            type: fileupload
            tab: General
        descripcion:
            label: Descripcion
            size: ''
            span: full
            type: richeditor
            tab: General
        tags:
            label: Tags
            nameFrom: tag
            descriptionFrom: tag
            span: auto
            type: relation
            tab: Configuración
        categorias:
            label: Categorias
            nameFrom: nombre
            descriptionFrom: nombre
            span: auto
            type: relation
            tab: Configuración
        tipo_inventario:
            label: Inventario
            options:
                1: 'Por Fecha'
                2: General
            default: 1
            span: auto
            type: radio
            tab: Configuración
        ind_calendario:
            label: 'Usar Calendario'
            span: auto
            default: 1
            type: switch
            comment: 'Permitirle al usuario indicar la fecha de disfrute'
            tab: Configuración
        disponible:
            label: Disponible
            span: auto
            trigger:
                action: show
                field: tipo_inventario
                condition: 'value[2]'
            default: '0'
            type: text
            tab: Configuración
        sumable:
            label: 'Es sumable'
            span: auto
            type: switch
            tab: Configuración
        aplica_impuestos:
            label: '¿Aplicar impuestos del hotel?'
            span: auto
            type: switch
            tab: Configuración
